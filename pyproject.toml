[project]
name = "job-market-insights"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps live in infra/airflow/requirements.txt (installed into the Airflow image).
# This file is for local tooling: tests and linting run without Airflow.

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pydantic==2.11.3",
    "pytest==8.3.5",
    "ruff==0.11.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
